<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Senses - Therapist Dashboard</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    
    <div id="loading-screen" class="fixed inset-0 bg-gray-100 flex items-center justify-center z-50">
        <div class="text-xl font-bold text-teal-600 animate-pulse">Loading Dashboard...</div>
    </div>

    <div id="root"></div>
    
    <script type="text/babel">
        const React = window.React; // Explicit import for safety
        const { useState, useEffect } = React;
        
        // --- ICONS ---
        const Calendar = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        );
        const Clock = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        );
        const FileText = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        );
        const Activity = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        );
        const CheckCircle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        );
        const XCircle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        );
        const AlertTriangle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        );
        const ChevronRight = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        );
        const Video = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        );
        const User = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
          </svg>
        );
        const ArrowRight = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        );
        const ClipboardList = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path>
          </svg>
        );
        const Save = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline>
          </svg>
        );
        const LogOut = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        );

        // --- MOCK DATA ---
        const CURRENT_USER = { name: "Ms. Sarah", role: "Occupational Therapist" };

        const SCHEDULE_DATA = [
          { 
            id: 101, 
            time: "09:00 AM", 
            childName: "Arav S.", 
            age: "5y 2m", 
            type: "Occupational Therapy", 
            sessionCount: "12 of 30",
            status: "completed",
            nextAction: { type: "handover", to: "Mr. Rahul (Speech)", room: "Room B" }
          },
          { 
            id: 102, 
            time: "10:00 AM", 
            childName: "Vihaan K.", 
            age: "4y", 
            type: "Occupational Therapy", 
            sessionCount: "8 of 20", 
            status: "active",
            nextAction: { type: "release", to: "Parent (Waiting Area)", room: "Reception" }
          },
          { 
            id: 103, 
            time: "11:00 AM", 
            childName: "Riya M.", 
            age: "6y", 
            type: "Sensory Integration", 
            sessionCount: "1 of 10", 
            status: "upcoming",
            nextAction: { type: "handover", to: "Ms. Priya (SpEd)", room: "Room C" }
          }
        ];

        const SESSION_PLAN = {
          goals: ["Improve Fine Motor Grasp", "Sensory Regulation"],
          activities: [
            { id: 1, name: "Theraputty Search", instruction: "Find 5 hidden beads in firm putty.", duration: "10 min" },
            { id: 2, name: "Scissor Skills", instruction: "Cut along curved lines on cardstock.", duration: "15 min" },
            { id: 3, name: "Proprioceptive Input", instruction: "Wheelbarrow walk - 3 laps.", duration: "10 min" }
          ],
          lastHomework: { task: "Play dough rolling", compliance: "partial" }
        };

        const HISTORY_LOG = [
          { date: "Feb 08", therapist: "Mr. Rahul (Speech)", note: "Good focus. Struggled with 'R' sound." },
          { date: "Feb 05", therapist: "Ms. Ananya (OT)", note: "High energy. Needed sensory breaks." }
        ];

        // --- COMPONENTS ---

        const ScheduleCard = ({ session, onStart }) => {
          const isNextHandover = session.nextAction.type === 'handover';
          
          return (
            <div className={`mb-4 rounded-xl border-l-4 shadow-sm bg-white overflow-hidden ${session.status === 'active' ? 'border-teal-500 ring-2 ring-teal-100' : 'border-gray-200'}`}>
              <div className="p-4 flex justify-between items-start">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-bold text-lg text-gray-800">{session.time}</span>
                    {session.status === 'active' && <span className="bg-teal-100 text-teal-700 text-xs px-2 py-0.5 rounded-full font-bold animate-pulse">NOW</span>}
                  </div>
                  <h3 className="text-xl font-bold text-gray-900">{session.childName} <span className="text-sm font-normal text-gray-500">({session.age})</span></h3>
                  <p className="text-sm text-teal-600 font-medium">{session.type} • Session {session.sessionCount}</p>
                </div>
                <button 
                  onClick={() => onStart(session)}
                  disabled={session.status === 'completed'}
                  className={`px-4 py-2 rounded-lg font-bold text-sm ${session.status === 'completed' ? 'bg-gray-100 text-gray-400' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
                >
                  {session.status === 'active' ? 'Resume Session' : session.status === 'completed' ? 'Completed' : 'Start Session'}
                </button>
              </div>

              <div className={`px-4 py-3 flex items-center justify-between ${isNextHandover ? 'bg-indigo-50 text-indigo-900' : 'bg-green-50 text-green-900'}`}>
                <div className="flex items-center gap-2">
                  <ArrowRight size={18} />
                  <span className="text-xs font-bold uppercase tracking-wider">After this session:</span>
                </div>
                <div className="font-bold text-sm flex items-center gap-2">
                  {isNextHandover ? (
                    <>
                      <span>HANDOVER TO:</span>
                      <span className="bg-white px-2 py-1 rounded border border-indigo-200">{session.nextAction.to}</span>
                    </>
                  ) : (
                    <>
                      <span>RELEASE TO:</span>
                      <span className="bg-white px-2 py-1 rounded border border-green-200">{session.nextAction.to}</span>
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const SessionExecution = ({ session, onBack }) => {
          const [activities, setActivities] = useState(SESSION_PLAN.activities.map(a => ({ ...a, status: 'pending' })));
          const [showHandoff, setShowHandoff] = useState(false);

          const handleStatusChange = (id, status) => {
            setActivities(activities.map(a => a.id === id ? { ...a, status } : a));
          };

          const allDone = activities.every(a => a.status !== 'pending');

          if (showHandoff) {
            return <HandoffScreen session={session} onComplete={onBack} />;
          }

          return (
            <div className="h-full flex flex-col bg-gray-50">
              <div className="bg-white border-b border-gray-200 p-4 flex items-center justify-between sticky top-0 z-10">
                <div>
                  <h2 className="text-xl font-bold text-gray-800">{session.childName}</h2>
                  <p className="text-sm text-gray-500">Session {session.sessionCount} • {session.type}</p>
                </div>
                <div className="flex gap-3">
                    <button onClick={onBack} className="text-gray-500 font-medium">Cancel</button>
                    <button 
                      disabled={!allDone}
                      onClick={() => setShowHandoff(true)}
                      className={`px-6 py-2 rounded-lg font-bold flex items-center gap-2 ${allDone ? 'bg-teal-600 text-white' : 'bg-gray-200 text-gray-400'}`}
                    >
                      <Save size={18} /> Complete & Note
                    </button>
                </div>
              </div>

              <div className="flex-1 overflow-auto p-6 max-w-5xl mx-auto w-full grid grid-cols-3 gap-6">
                
                <div className="col-span-1 space-y-6">
                    <div className={`p-4 rounded-xl border ${SESSION_PLAN.lastHomework.compliance === 'full' ? 'bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-200'}`}>
                        <h4 className="text-sm font-bold text-gray-700 mb-1">Homework Check</h4>
                        <p className="text-sm text-gray-800">Task: {SESSION_PLAN.lastHomework.task}</p>
                        <div className="mt-2 text-xs font-bold uppercase tracking-wide flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-yellow-500"></span>
                            Parent Marked: {SESSION_PLAN.lastHomework.compliance}
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-gray-50 p-3 border-b border-gray-200 font-bold text-gray-700 text-sm">
                            Recent History
                        </div>
                        <div className="divide-y divide-gray-100">
                            {HISTORY_LOG.map((log, i) => (
                                <div key={i} className="p-3">
                                    <div className="flex justify-between text-xs mb-1">
                                        <span className="font-bold text-gray-600">{log.therapist}</span>
                                        <span className="text-gray-400">{log.date}</span>
                                    </div>
                                    <p className="text-sm text-gray-600 italic">"{log.note}"</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                <div className="col-span-2 space-y-6">
                   <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 flex items-start gap-3">
                      <Activity className="text-blue-600 mt-1" size={20} />
                      <div>
                          <h3 className="font-bold text-blue-900">Today's Goals</h3>
                          <ul className="list-disc list-inside text-sm text-blue-800 mt-1">
                              {SESSION_PLAN.goals.map(g => <li key={g}>{g}</li>)}
                          </ul>
                      </div>
                   </div>

                   <h3 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                       <ClipboardList size={20} /> Prescribed Activities
                   </h3>

                   <div className="space-y-4">
                      {activities.map(activity => (
                          <div key={activity.id} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm transition-all hover:shadow-md">
                              <div className="flex justify-between items-start mb-3">
                                  <div>
                                      <h4 className="font-bold text-gray-900 text-lg">{activity.name}</h4>
                                      <p className="text-gray-600 text-sm">{activity.instruction}</p>
                                  </div>
                                  <span className="text-xs font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded">{activity.duration}</span>
                              </div>

                              <div className="flex gap-3 mt-4">
                                  <button 
                                    onClick={() => handleStatusChange(activity.id, 'completed')}
                                    className={`flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 border transition-colors ${activity.status === 'completed' ? 'bg-green-100 border-green-500 text-green-800' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                  >
                                     <CheckCircle size={16} /> Completed
                                  </button>
                                  <button 
                                     onClick={() => handleStatusChange(activity.id, 'partial')}
                                     className={`flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 border transition-colors ${activity.status === 'partial' ? 'bg-yellow-100 border-yellow-500 text-yellow-800' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                  >
                                     <Activity size={16} /> Partial
                                  </button>
                                  <button 
                                     onClick={() => handleStatusChange(activity.id, 'skipped')}
                                     className={`flex-1 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 border transition-colors ${activity.status === 'skipped' ? 'bg-red-50 border-red-300 text-red-800' : 'bg-white border-gray-200 text-gray-500 hover:bg-gray-50'}`}
                                  >
                                     <XCircle size={16} /> Skipped
                                  </button>
                              </div>
                              
                              {(activity.status === 'skipped' || activity.status === 'partial') && (
                                  <div className="mt-3">
                                      <input 
                                        type="text" 
                                        placeholder="Reason for deviation (Mandatory)" 
                                        className="w-full p-2 text-sm border border-red-200 rounded bg-red-50 focus:outline-none focus:border-red-400 placeholder-red-300"
                                      />
                                  </div>
                              )}
                          </div>
                      ))}
                   </div>
                   
                   <div className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 cursor-pointer">
                       <Video className="mx-auto text-gray-400 mb-2" size={32} />
                       <p className="font-medium text-gray-600">Attach Session Video</p>
                       <p className="text-xs text-gray-400">Upload or Link from Drive (Start vs End comparison)</p>
                   </div>
                </div>
              </div>
            </div>
          );
        };

        const HandoffScreen = ({ session, onComplete }) => {
          return (
            <div className="h-full flex flex-col items-center justify-center bg-gray-50 p-6">
               <div className="bg-white max-w-lg w-full p-8 rounded-2xl shadow-lg text-center">
                   <div className="w-16 h-16 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6">
                       <CheckCircle size={32} />
                   </div>
                   
                   <h2 className="text-2xl font-bold text-gray-800 mb-2">Session Complete!</h2>
                   <p className="text-gray-500 mb-8">Notes saved successfully.</p>

                   <div className="bg-gray-100 p-6 rounded-xl mb-8">
                       <p className="text-xs font-bold text-gray-500 uppercase mb-2">Immediate Next Action</p>
                       {session.nextAction.type === 'handover' ? (
                           <div>
                               <h3 className="text-xl font-bold text-indigo-700 flex items-center justify-center gap-2">
                                   <User size={24} /> Handover to {session.nextAction.to}
                               </h3>
                               <p className="text-indigo-600 font-medium mt-1">{session.nextAction.room}</p>
                           </div>
                       ) : (
                           <div>
                               <h3 className="text-xl font-bold text-green-700 flex items-center justify-center gap-2">
                                   <LogOut size={24} /> Release to Parent
                               </h3>
                               <p className="text-green-600 font-medium mt-1">Waiting Area</p>
                           </div>
                       )}
                   </div>

                   <button 
                     onClick={onComplete} 
                     className="w-full py-4 bg-teal-600 text-white rounded-xl font-bold text-lg hover:bg-teal-700 shadow-md"
                   >
                     Confirm Action & Close
                   </button>
               </div>
            </div>
          );
        };

        // --- MAIN LAYOUT ---
        function TherapistDashboard() {
          const [currentSession, setCurrentSession] = useState(null);

          useEffect(() => {
            document.getElementById('loading-screen').style.display = 'none';
          }, []);

          return (
            <div className="min-h-screen bg-gray-100 font-sans text-gray-900">
                {!currentSession ? (
                    <div className="max-w-2xl mx-auto p-4">
                        <header className="flex items-center justify-between mb-8 py-4">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">Good Morning, {CURRENT_USER.name}</h1>
                                <p className="text-gray-500">Today's Schedule • Feb 10, 2026</p>
                            </div>
                            <div className="w-10 h-10 bg-teal-600 rounded-full text-white flex items-center justify-center font-bold">
                                MS
                            </div>
                        </header>

                        <div className="space-y-6">
                            {SCHEDULE_DATA.map(session => (
                                <ScheduleCard 
                                  key={session.id} 
                                  session={session} 
                                  onStart={setCurrentSession} 
                                />
                            ))}
                        </div>
                    </div>
                 ) : (
                    <SessionExecution 
                      session={currentSession} 
                      onBack={() => setCurrentSession(null)} 
                    />
                )}
            </div>
          );
        }
        ReactDOM.render(
        <TherapistDashboard />,
        document.getElementById('root')
        );
    </script>
</body>
</html>
