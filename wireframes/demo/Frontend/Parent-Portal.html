<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Senses - Parent Portal</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Custom scrollbar for dashboard feel */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    
    <div id="loading-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="text-xl font-bold text-rose-500 animate-pulse">Loading Portal...</div>
    </div>

    <div id="root"></div>
    
    <script type="text/babel">
        // Setup: React from CDN
        const React = window.React;
        const { useState, useEffect } = React;
        
        // Lucide Icons as React Components (imported inline)
        const User = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        );
        
        const Calendar = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        );
        
        const CreditCard = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
        );
        
        const Activity = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        );
        
        const Home = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        );
        
        const Download = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        );
        
        const CheckCircle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        );
        
        const Video = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        );
        
        const AlertCircle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        );
        
        const FileText = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        );

        // --- MOCK DATA BASED ON SOP CONTEXT ---
        const MOCK_DATA = {
          child: {
            name: "Arav Sharma",
            age: "5 Yrs",
            id: "8S-2026-042",
            diagnosis: "Sensory Processing Disorder",
            photo: "/api/placeholder/100/100"
          },
          program: {
            currentBlock: "Feb - April 2026",
            types: ["Occupational Therapy", "Speech Therapy"],
            totalSessions: 30,
            completedSessions: 12,
            nextMilestone: "Bilateral Integration",
            milestoneProgress: 65,
          },
          alerts: [
            { type: 'payment', message: 'Payment due for upcoming 5 sessions.', urgency: 'high' },
            { type: 'update', message: 'New progress video available.', urgency: 'medium' }
          ],
          appointments: [
            { id: 1, date: "Tomorrow, 10 Feb", time: "4:00 PM", therapist: "Ms. Ananya", type: "Occupational Therapy", status: "confirmed" },
            { id: 2, date: "Wed, 12 Feb", time: "4:00 PM", therapist: "Mr. Rahul", type: "Speech Therapy", status: "confirmed" }
          ],
          homework: [
            { id: 1, title: "Animal Walk", desc: "Bear walk for 5 mins to improve core strength.", completed: false },
            { id: 2, title: "Sound Matching", desc: "Identify 3 household sounds.", completed: true }
          ],
          billing: {
            outstanding: 1800,
            history: [
              { id: 101, date: "01 Feb 2026", amount: 6000, items: "10 Session Package", status: "Paid" },
              { id: 102, date: "15 Jan 2026", amount: 600, items: "Evaluation Fee", status: "Paid" }
            ]
          }
        };

        // --- COMPONENTS ---

        // 1. LOGIN SCREEN
        const LoginScreen = ({ onLogin }) => {
          const [step, setStep] = useState(1);
          const [mobile, setMobile] = useState('');

          return (
            <div className="flex flex-col items-center justify-center h-screen bg-teal-50 p-6">
              <div className="w-24 h-24 bg-teal-500 rounded-full flex items-center justify-center mb-6 shadow-lg">
                <span className="text-3xl font-bold text-white">8S</span>
              </div>
              <h1 className="text-2xl font-bold text-gray-800 mb-2">8 Senses Clinic</h1>
              <p className="text-gray-500 mb-8 text-center">Parent Portal Login</p>

              <div className="w-full max-w-sm bg-white p-6 rounded-2xl shadow-sm">
                {step === 1 ? (
                  <>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Mobile Number</label>
                    <div className="flex gap-2 mb-4">
                      <span className="p-3 bg-gray-100 rounded-lg text-gray-600">+91</span>
                      <input 
                        type="tel" 
                        className="flex-1 p-3 bg-gray-50 rounded-lg border-none focus:ring-2 focus:ring-teal-400 outline-none"
                        placeholder="98765 43210"
                        value={mobile}
                        onChange={(e) => setMobile(e.target.value)}
                      />
                    </div>
                    <button 
                      onClick={() => setStep(2)}
                      className="w-full bg-teal-600 text-white py-3 rounded-xl font-medium hover:bg-teal-700 transition"
                    >
                      Get OTP
                    </button>
                  </>
                ) : (
                  <>
                    <label className="block text-sm font-medium text-gray-700 mb-2">Enter OTP</label>
                    <input 
                      type="text" 
                      className="w-full p-3 bg-gray-50 rounded-lg border-none focus:ring-2 focus:ring-teal-400 outline-none mb-4 text-center tracking-widest text-xl"
                      placeholder="• • • •"
                    />
                    <button 
                      onClick={onLogin}
                      className="w-full bg-teal-600 text-white py-3 rounded-xl font-medium hover:bg-teal-700 transition"
                    >
                      Verify & Login
                    </button>
                    <button onClick={() => setStep(1)} className="w-full mt-4 text-sm text-gray-500">Change Number</button>
                  </>
                )}
              </div>
            </div>
          );
        };

        // 2. DASHBOARD (HOME)
        const Dashboard = ({ data }) => {
          return (
            <div className="p-4 space-y-6 pb-24">
              {/* Header / Profile Card */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-500 text-xl font-bold">
                  {data.child.name.charAt(0)}
                </div>
                <div>
                  <h2 className="text-xl font-bold text-gray-800">{data.child.name}</h2>
                  <p className="text-sm text-gray-500">{data.child.age} • {data.child.id}</p>
                  <div className="flex gap-2 mt-1">
                    {data.program.types.map(t => (
                      <span key={t} className="text-xs px-2 py-0.5 bg-teal-50 text-teal-700 rounded-md font-medium">
                        {t.split(' ')[0]}
                      </span>
                    ))}
                  </div>
                </div>
              </div>

              {/* Alerts Section */}
              {data.alerts.map((alert, idx) => (
                <div key={idx} className={`p-4 rounded-xl flex items-start gap-3 ${alert.urgency === 'high' ? 'bg-red-50 text-red-800' : 'bg-blue-50 text-blue-800'}`}>
                  <AlertCircle size={20} className="mt-0.5" />
                  <div>
                    <p className="font-semibold text-sm">{alert.type === 'payment' ? 'Action Required' : 'Update'}</p>
                    <p className="text-sm opacity-90">{alert.message}</p>
                  </div>
                </div>
              ))}

              {/* Progress Summary */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex justify-between items-end mb-2">
                  <h3 className="font-bold text-gray-700">Current Program</h3>
                  <span className="text-xs text-gray-400">{data.program.currentBlock}</span>
                </div>
                
                <div className="mb-4">
                  <div className="flex justify-between text-sm mb-1">
                    <span className="text-gray-600">Session Progress</span>
                    <span className="font-bold text-teal-600">{data.program.completedSessions}/{data.program.totalSessions}</span>
                  </div>
                  <div className="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                    <div 
                      className="bg-teal-500 h-full rounded-full transition-all duration-500" 
                      style={{ width: `${(data.program.completedSessions / data.program.totalSessions) * 100}%` }}
                    ></div>
                  </div>
                </div>

                <div className="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                  <div>
                    <p className="text-xs text-gray-500 uppercase font-bold tracking-wide">Next Milestone</p>
                    <p className="text-gray-800 font-medium">{data.program.nextMilestone}</p>
                  </div>
                  <div className="h-10 w-10 rounded-full border-4 border-teal-100 flex items-center justify-center text-xs font-bold text-teal-600">
                    {data.program.milestoneProgress}%
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // 3. PROGRESS & REPORTS
        const ProgressScreen = () => {
          return (
            <div className="p-4 space-y-6 pb-24">
              <h2 className="text-2xl font-bold text-gray-800">Therapy Progress</h2>

              {/* Video Comparison */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-bold text-gray-700 flex items-center gap-2">
                    <Video size={18} className="text-teal-500"/> 
                    Video Comparison
                  </h3>
                  <span className="text-xs bg-teal-100 text-teal-800 px-2 py-1 rounded-md">New</span>
                </div>
                <p className="text-xs text-gray-500 mb-4">Compare baseline (Start of Plan) vs. Current status.</p>
                
                <div className="grid grid-cols-2 gap-3">
                  <div className="space-y-2">
                    <div className="aspect-video bg-gray-200 rounded-lg flex items-center justify-center relative">
                      <div className="w-8 h-8 bg-white/80 rounded-full flex items-center justify-center shadow">
                         <div className="w-0 h-0 border-t-4 border-t-transparent border-l-8 border-l-teal-600 border-b-4 border-b-transparent ml-1"></div>
                      </div>
                      <span className="absolute bottom-2 left-2 text-[10px] bg-black/50 text-white px-1.5 rounded">Jan 10</span>
                    </div>
                    <p className="text-xs text-center font-medium text-gray-600">Baseline</p>
                  </div>
                  <div className="space-y-2">
                    <div className="aspect-video bg-gray-200 rounded-lg flex items-center justify-center relative">
                       <div className="w-8 h-8 bg-white/80 rounded-full flex items-center justify-center shadow">
                         <div className="w-0 h-0 border-t-4 border-t-transparent border-l-8 border-l-teal-600 border-b-4 border-b-transparent ml-1"></div>
                      </div>
                      <span className="absolute bottom-2 left-2 text-[10px] bg-black/50 text-white px-1.5 rounded">Feb 09</span>
                    </div>
                    <p className="text-xs text-center font-medium text-gray-600">Current</p>
                  </div>
                </div>
              </div>

              {/* Milestone Timeline */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="font-bold text-gray-700 mb-4">Milestone Tracker</h3>
                <div className="space-y-6 pl-2 border-l-2 border-gray-100 ml-2">
                  {[
                    { title: "Sensory Regulation", date: "Jan 15", status: "Achieved", color: "text-green-600" },
                    { title: "Fine Motor Grasp", date: "In Progress", status: "80% Done", color: "text-blue-600" },
                    { title: "Bilateral Integration", date: "Upcoming", status: "Pending", color: "text-gray-400" }
                  ].map((m, i) => (
                    <div key={i} className="relative pl-6">
                      <div className={`absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 border-white shadow-sm ${m.status === 'Achieved' ? 'bg-green-500' : m.status === 'Pending' ? 'bg-gray-300' : 'bg-blue-500'}`}></div>
                      <p className="font-medium text-gray-800 text-sm">{m.title}</p>
                      <div className="flex justify-between items-center mt-1">
                        <span className={`text-xs ${m.color} font-medium`}>{m.status}</span>
                        {m.date && <span className="text-xs text-gray-400">{m.date}</span>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

               <button className="w-full py-3 border border-teal-200 text-teal-700 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-teal-50">
                <Download size={18} />
                Download Detailed Report
              </button>
            </div>
          );
        };

        // 4. APPOINTMENTS
        const AppointmentsScreen = ({ data }) => {
          return (
            <div className="p-4 space-y-4 pb-24">
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Appointments</h2>
              
              {data.appointments.map(apt => (
                <div key={apt.id} className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-teal-500 flex flex-col gap-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-lg font-bold text-gray-800">{apt.time}</p>
                      <p className="text-sm text-teal-600 font-medium">{apt.date}</p>
                    </div>
                    <span className="px-3 py-1 bg-green-50 text-green-700 text-xs rounded-full font-medium">Confirmed</span>
                  </div>
                  
                  <div className="flex items-center gap-3 py-2 border-t border-b border-gray-50">
                    <div className="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                      <User size={20} className="text-gray-500" />
                    </div>
                    <div>
                      <p className="text-sm font-bold text-gray-700">{apt.therapist}</p>
                      <p className="text-xs text-gray-500">{apt.type}</p>
                    </div>
                  </div>

                  <button className="text-sm text-gray-500 hover:text-teal-600 font-medium border border-gray-200 rounded-lg py-2 mt-1">
                    Request Reschedule
                  </button>
                </div>
              ))}

              <p className="text-xs text-center text-gray-400 mt-4 px-8">
                Need to cancel? Please request at least 24 hours in advance to avoid cancellation charges.
              </p>
            </div>
          );
        };

        // 5. BILLING
        const BillingScreen = ({ data }) => {
          return (
            <div className="p-4 space-y-6 pb-24">
              <h2 className="text-2xl font-bold text-gray-800">Billing & Payments</h2>

              {/* Outstanding Balance Card */}
              <div className="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-6 text-white shadow-lg">
                <p className="text-gray-300 text-sm mb-1">Outstanding Balance</p>
                <h3 className="text-3xl font-bold mb-4">₹ {data.billing.outstanding}</h3>
                <div className="flex gap-3">
                  <button className="flex-1 bg-white text-gray-900 py-2 rounded-lg font-bold text-sm">Pay Now</button>
                  <button className="px-4 py-2 border border-gray-600 rounded-lg text-sm font-medium">History</button>
                </div>
              </div>

              {/* Session Balance Visualization */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                 <h4 className="font-bold text-gray-700 mb-3 text-sm">Session Balance</h4>
                 <div className="flex gap-2 mb-2">
                    <div className="flex-1 bg-green-100 text-green-800 py-2 rounded-lg text-center">
                      <p className="text-xl font-bold">12</p>
                      <p className="text-[10px] uppercase font-bold">Completed</p>
                    </div>
                    <div className="flex-1 bg-teal-100 text-teal-800 py-2 rounded-lg text-center">
                       <p className="text-xl font-bold">18</p>
                       <p className="text-[10px] uppercase font-bold">Remaining</p>
                    </div>
                 </div>
                 <p className="text-xs text-gray-500 text-center mt-2">Plan renewal due in 12 sessions.</p>
              </div>

              {/* Recent Transactions */}
              <div>
                <h4 className="font-bold text-gray-700 mb-3 text-sm">Recent Transactions</h4>
                <div className="space-y-3">
                  {data.billing.history.map(txn => (
                    <div key={txn.id} className="bg-white p-4 rounded-xl border border-gray-100 flex justify-between items-center">
                      <div className="flex gap-3 items-center">
                        <div className="w-10 h-10 bg-green-50 rounded-full flex items-center justify-center text-green-600">
                          <CreditCard size={18} />
                        </div>
                        <div>
                          <p className="text-sm font-bold text-gray-800">{txn.items}</p>
                          <p className="text-xs text-gray-500">{txn.date}</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <p className="text-sm font-bold text-gray-800">₹{txn.amount}</p>
                        <div className="flex items-center gap-1 justify-end text-teal-600 mt-1 cursor-pointer">
                          <span className="text-[10px] font-bold">RECEIPT</span>
                          <Download size={10} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        // 6. HOMEWORK
        const HomeworkScreen = ({ data }) => {
          const [tasks, setTasks] = useState(data.homework);

          const toggleTask = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
          };

          return (
            <div className="p-4 space-y-6 pb-24">
              <h2 className="text-2xl font-bold text-gray-800">Home Practice</h2>
              <div className="bg-teal-50 p-4 rounded-xl border border-teal-100">
                <p className="text-sm text-teal-800">
                  <span className="font-bold">Note from Ms. Ananya:</span> "Great job with stability last week. Please focus on the Bear Walk this week to strengthen the core."
                </p>
              </div>

              <div className="space-y-3">
                {tasks.map(task => (
                  <div key={task.id} className={`p-4 rounded-2xl border transition-all ${task.completed ? 'bg-green-50 border-green-200' : 'bg-white border-gray-100 shadow-sm'}`}>
                    <div className="flex items-start justify-between gap-4">
                      <div className="flex-1">
                        <h4 className={`font-bold text-lg ${task.completed ? 'text-green-800' : 'text-gray-800'}`}>{task.title}</h4>
                        <p className="text-sm text-gray-600 mt-1">{task.desc}</p>
                      </div>
                      <button 
                        onClick={() => toggleTask(task.id)}
                        className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${task.completed ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-300 hover:bg-gray-200'}`}
                      >
                        <CheckCircle size={24} />
                      </button>
                    </div>
                    {task.completed && (
                      <div className="mt-3 pt-3 border-t border-green-200/50 flex justify-between items-center">
                         <span className="text-xs text-green-700 font-medium">Marked as Done</span>
                         <span className="text-xs text-green-600">Great job!</span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          );
        };

        // --- NAV BUTTON ---
        const NavButton = ({ icon, label, isActive, onClick }) => (
          <button 
            onClick={onClick} 
            className={`flex flex-col items-center justify-center p-2 rounded-xl w-16 transition-all ${isActive ? 'text-teal-600' : 'text-gray-400 hover:text-gray-600'}`}
          >
            {icon}
            <span className="text-[10px] font-medium mt-1">{label}</span>
          </button>
        );

        // --- MAIN APP ---
        function App() {
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [activeTab, setActiveTab] = useState('home');

          useEffect(() => {
            document.getElementById('loading-screen').style.display = 'none';
          }, []);

          if (!isLoggedIn) {
            return <LoginScreen onLogin={() => setIsLoggedIn(true)} />;
          }

          const renderContent = () => {
            switch(activeTab) {
              case 'home': return <Dashboard data={MOCK_DATA} />;
              case 'progress': return <ProgressScreen />;
              case 'calendar': return <AppointmentsScreen data={MOCK_DATA} />;
              case 'billing': return <BillingScreen data={MOCK_DATA} />;
              case 'homework': return <HomeworkScreen data={MOCK_DATA} />;
              default: return <Dashboard data={MOCK_DATA} />;
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 font-sans max-w-md mx-auto relative shadow-2xl overflow-hidden">
              
              {/* Scrollable Content Area */}
              <div className="h-full overflow-y-auto custom-scrollbar">
                {renderContent()}
              </div>

              {/* Bottom Navigation */}
              <div className="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 px-2 py-2 flex justify-around items-center z-50 rounded-t-2xl shadow-[0_-5px_10px_rgba(0,0,0,0.02)]">
                
                <NavButton 
                  icon={<Home size={22} />} 
                  label="Home" 
                  isActive={activeTab === 'home'} 
                  onClick={() => setActiveTab('home')} 
                />
                <NavButton 
                  icon={<Activity size={22} />} 
                  label="Progress" 
                  isActive={activeTab === 'progress'} 
                  onClick={() => setActiveTab('progress')} 
                />
                {/* Central Action Button (Homework) */}
                <button 
                  onClick={() => setActiveTab('homework')}
                  className={`-mt-8 w-14 h-14 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95 ${activeTab === 'homework' ? 'bg-teal-600 ring-4 ring-teal-100' : 'bg-teal-500'}`}
                >
                  <CheckCircle size={24} className="text-white" />
                </button>
                
                <NavButton 
                  icon={<Calendar size={22} />} 
                  label="Schedule" 
                  isActive={activeTab === 'calendar'} 
                  onClick={() => setActiveTab('calendar')} 
                />
                <NavButton 
                  icon={<FileText size={22} />} 
                  label="Billing" 
                  isActive={activeTab === 'billing'} 
                  onClick={() => setActiveTab('billing')} 
                />
              </div>
            </div>
          );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
