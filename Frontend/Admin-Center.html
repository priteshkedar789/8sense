<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Senses - Admin Center</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-gray-900">
    
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
          LayoutDashboard, Calendar, Users, FileText, DollarSign, AlertTriangle, 
          TrendingUp, CheckCircle, XCircle, Settings, Activity, ChevronRight, 
          Clock, PieChart, BarChart2, List
        } = lucideReact;

        // --- MOCK DATA ---
        const METRICS = {
          daily: {
            scheduled: 85,
            completed: 42,
            cancelled: 3,
            refilled: 2,
            revenue: 28500,
            expectedRevenue: 51000
          },
          alerts: [
            { id: 1, type: 'urgent', message: '3 Session Notes Overdue (>4hrs)', source: 'Ms. Sarah' },
            { id: 2, type: 'warning', message: 'Program Progress Stalled (4 weeks)', source: 'Patient: Kabir J.' },
            { id: 3, type: 'financial', message: 'Pending Approval: Fee Waiver Request', source: 'Front Desk' }
          ]
        };

        const THERAPISTS = [
          { id: 1, name: 'Ms. Ananya', role: 'OT', utilisation: 92, compliance: 100, deviation: 5, adherence: 'High' },
          { id: 2, name: 'Mr. Rahul', role: 'Speech', utilisation: 85, compliance: 75, deviation: 32, adherence: 'Low' },
          { id: 3, name: 'Ms. Priya', role: 'SpEd', utilisation: 78, compliance: 95, deviation: 12, adherence: 'Medium' },
        ];

        const EXCEPTIONS = [
          { id: 101, type: 'Plan Change', requestor: 'Ms. Sarah', detail: 'Increase OT frequency to 3x/week', status: 'pending' },
          { id: 102, type: 'Discount', requestor: 'Front Desk', detail: '10% Sibling Discount - New Reg', status: 'pending' },
          { id: 103, type: 'Schedule Override', requestor: 'Parent', detail: 'Block recurring slot (Admin Only)', status: 'pending' }
        ];

        // --- COMPONENTS ---

        const Sidebar = ({ active, onNavigate }) => {
          const items = [
            { id: 'overview', label: 'Overview', icon: LayoutDashboard },
            { id: 'schedule', label: 'Master Schedule', icon: Calendar },
            { id: 'programs', label: 'Program Builder', icon: FileText },
            { id: 'therapists', label: 'Therapists', icon: Users },
            { id: 'financials', label: 'Financials', icon: DollarSign },
            { id: 'exceptions', label: 'Approvals', icon: AlertTriangle, count: 3 },
          ];

          return (
            <div className="w-64 bg-slate-900 text-slate-300 flex flex-col h-full">
              <div className="p-6">
                <div className="flex items-center gap-3 text-white font-bold text-xl">
                  <div className="w-8 h-8 bg-teal-500 rounded flex items-center justify-center">8S</div>
                  <span>Admin</span>
                </div>
                <p className="text-xs text-slate-500 mt-1 uppercase tracking-wider">Clinic Manager</p>
              </div>
              
              <nav className="flex-1 px-4 space-y-2">
                {items.map(item => (
                  <button
                    key={item.id}
                    onClick={() => onNavigate(item.id)}
                    className={`w-full flex items-center justify-between p-3 rounded-lg transition-colors ${active === item.id ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}`}
                  >
                    <div className="flex items-center gap-3">
                      <item.icon size={20} />
                      <span className="font-medium">{item.label}</span>
                    </div>
                    {item.count && (
                      <span className="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{item.count}</span>
                    )}
                  </button>
                ))}
              </nav>

              <div className="p-4 border-t border-slate-800">
                <button className="flex items-center gap-3 text-slate-400 hover:text-white">
                  <Settings size={20} />
                  <span>System Config</span>
                </button>
              </div>
            </div>
          );
        };

        const KPICard = ({ title, value, sub, icon: Icon, trend, color }) => (
          <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
            <div className="flex justify-between items-start mb-4">
              <div>
                <p className="text-xs font-bold text-gray-500 uppercase tracking-wide">{title}</p>
                <h3 className="text-2xl font-bold text-gray-800 mt-1">{value}</h3>
              </div>
              <div className={`p-2 rounded-lg ${color === 'teal' ? 'bg-teal-50 text-teal-600' : color === 'blue' ? 'bg-blue-50 text-blue-600' : 'bg-purple-50 text-purple-600'}`}>
                <Icon size={24} />
              </div>
            </div>
            <div className="flex items-center gap-2">
              {trend === 'up' ? <TrendingUp size={16} className="text-green-500" /> : <Activity size={16} className="text-gray-400" />}
              <p className="text-sm text-gray-500">{sub}</p>
            </div>
          </div>
        );

        const AlertPanel = () => (
          <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden h-full">
            <div className="bg-red-50 p-4 border-b border-red-100 flex justify-between items-center">
              <h3 className="font-bold text-red-900 flex items-center gap-2">
                <AlertTriangle size={18} /> Action Required
              </h3>
              <span className="bg-red-200 text-red-800 text-xs px-2 py-1 rounded-full font-bold">3 Pending</span>
            </div>
            <div className="divide-y divide-gray-100">
              {METRICS.alerts.map(alert => (
                <div key={alert.id} className="p-4 hover:bg-gray-50 transition-colors cursor-pointer flex items-start gap-3">
                  <div className={`mt-1 w-2 h-2 rounded-full ${alert.type === 'urgent' ? 'bg-red-500' : 'bg-amber-500'}`}></div>
                  <div>
                    <p className="text-sm font-bold text-gray-800">{alert.message}</p>
                    <p className="text-xs text-gray-500 mt-1">Source: {alert.source}</p>
                  </div>
                  <ChevronRight size={16} className="ml-auto text-gray-300" />
                </div>
              ))}
            </div>
          </div>
        );

        const ProgramBuilder = () => (
          <div className="space-y-6">
            <div className="flex justify-between items-center">
              <h2 className="text-2xl font-bold text-gray-800">Program Design</h2>
              <button className="bg-teal-600 text-white px-4 py-2 rounded-lg font-bold text-sm">+ New Program</button>
            </div>

            <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
              <div className="flex items-center gap-4 mb-6 border-b pb-4">
                <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-600">KJ</div>
                <div>
                  <h3 className="text-lg font-bold text-gray-800">Kabir J. (4 Years)</h3>
                  <p className="text-sm text-gray-500">Evaluation: Sensory Processing Disorder • Evaluator: Ms. Ananya</p>
                </div>
                <div className="ml-auto flex gap-2">
                    <span className="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded">Ref: EVAL-2026-09</span>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-6">
                <div className="col-span-1 space-y-4 border-r pr-6">
                    <h4 className="text-sm font-bold text-gray-500 uppercase">1. Therapy Domains</h4>
                    <div className="space-y-3">
                        <div className="flex justify-between items-center p-3 bg-teal-50 border border-teal-200 rounded-lg">
                            <span className="font-bold text-teal-900">Occupational Therapy</span>
                            <input type="number" value="30" className="w-16 p-1 text-center border border-teal-300 rounded font-bold" />
                        </div>
                        <div className="flex justify-between items-center p-3 bg-gray-50 border border-gray-200 rounded-lg opacity-60">
                            <span className="font-medium text-gray-700">Speech Therapy</span>
                            <span className="text-xs text-gray-400">Not prescribed</span>
                        </div>
                    </div>
                </div>

                <div className="col-span-2 space-y-4">
                    <h4 className="text-sm font-bold text-gray-500 uppercase">2. Activity Sequence & Milestones</h4>
                    
                    <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <div className="flex justify-between mb-2">
                            <span className="font-bold text-gray-800">Phase 1: Foundation (Sessions 1-10)</span>
                            <span className="text-xs text-gray-500">Goal: Sensory Regulation</span>
                        </div>
                        <div className="space-y-2">
                            <div className="flex items-center gap-2 text-sm bg-white p-2 rounded border border-gray-200">
                                <Activity size={16} className="text-teal-600" />
                                <span>Tactile Desensitization (Brushing Protocol)</span>
                            </div>
                            <div className="flex items-center gap-2 text-sm bg-white p-2 rounded border border-gray-200">
                                <Activity size={16} className="text-teal-600" />
                                <span>Vestibular Input (Swing - Linear)</span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <div className="flex justify-between mb-2">
                            <span className="font-bold text-gray-800">Phase 2: Skill Acquisition (Sessions 11-20)</span>
                            <span className="text-xs text-gray-500">Goal: Fine Motor Grasp</span>
                        </div>
                        <div className="text-sm text-gray-400 italic text-center py-2">Drag activities from library to configure...</div>
                    </div>
                </div>
              </div>
              
              <div className="mt-6 flex justify-end gap-3 border-t pt-4">
                  <div className="mr-auto text-sm text-gray-500 flex items-center gap-2">
                     <DollarSign size={16} /> Est. Cost: ₹ 18,000 (30 Sessions)
                  </div>
                  <button className="px-4 py-2 text-gray-600 font-medium">Save Draft</button>
                  <button className="px-6 py-2 bg-teal-600 text-white font-bold rounded-lg shadow-sm">Approve Program</button>
              </div>
            </div>
          </div>
        );

        const FinancialDashboard = () => (
          <div className="space-y-6">
              <h2 className="text-2xl font-bold text-gray-800">Financial Health</h2>
              
              <div className="grid grid-cols-3 gap-6">
                  <KPICard title="Total Collections" value="₹ 4,25,000" sub="Month to Date" icon={DollarSign} trend="up" color="green" />
                  <KPICard title="Payroll Liability" value="₹ 1,85,000" sub="Projected" icon={Users} color="blue" />
                  <KPICard title="Outstanding" value="₹ 42,000" sub="12 Patients > 15 days" icon={AlertTriangle} color="red" />
              </div>

              <div className="grid grid-cols-2 gap-6">
                  <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                     <h3 className="font-bold text-gray-800 mb-4">Cancellation Revenue Logic</h3>
                     <p className="text-xs text-gray-500 mb-4">Tracking breakdown of cancellation charges based on Slot Refill status.</p>
                     
                     <div className="space-y-4">
                         <div className="flex items-center justify-between">
                             <span className="text-sm font-medium text-gray-600">Clinic Retained (Refilled Slots)</span>
                             <span className="font-bold text-green-600">₹ 12,000</span>
                         </div>
                         <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                             <div className="bg-green-500 h-full w-[65%]"></div>
                         </div>
                         
                         <div className="flex items-center justify-between">
                             <span className="text-sm font-medium text-gray-600">Therapist Credited (Idle Slots)</span>
                             <span className="font-bold text-blue-600">₹ 6,500</span>
                         </div>
                         <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                             <div className="bg-blue-500 h-full w-[35%]"></div>
                         </div>
                     </div>
                     <div className="mt-4 p-3 bg-gray-50 rounded text-xs text-gray-500">
                         *Refilled slots = Revenue for Clinic. Idle slots = Compensation for Therapist.
                     </div>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                     <h3 className="font-bold text-gray-800 mb-4">Payroll Preview</h3>
                     <table className="w-full text-sm">
                         <thead className="text-left text-gray-500 border-b">
                             <tr>
                                 <th className="pb-2">Therapist</th>
                                 <th className="pb-2">Sessions</th>
                                 <th className="pb-2">Payout</th>
                                 <th className="pb-2">Status</th>
                             </tr>
                         </thead>
                         <tbody className="divide-y">
                             <tr>
                                 <td className="py-2">Ms. Ananya</td>
                                 <td>112</td>
                                 <td className="font-bold">₹ 56,000</td>
                                 <td className="text-green-600">Verified</td>
                             </tr>
                             <tr>
                                 <td className="py-2">Mr. Rahul</td>
                                 <td>88</td>
                                 <td className="font-bold">₹ 44,000</td>
                                 <td className="text-amber-600">Pending</td>
                             </tr>
                         </tbody>
                     </table>
                  </div>
              </div>
          </div>
        );

        const TherapistManagement = () => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800">Therapist Performance</h2>
                <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <table className="w-full text-left">
                        <thead className="bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-500 uppercase">
                            <tr>
                                <th className="p-4">Therapist</th>
                                <th className="p-4">Utilisation</th>
                                <th className="p-4">Note Compliance</th>
                                <th className="p-4">Prog. Deviation</th>
                                <th className="p-4">Rating</th>
                                <th className="p-4">Action</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100 text-sm">
                            {THERAPISTS.map(t => (
                                <tr key={t.id} className="hover:bg-gray-50">
                                    <td className="p-4 font-bold text-gray-800">{t.name} <span className="font-normal text-gray-500">({t.role})</span></td>
                                    <td className="p-4">
                                        <div className="flex items-center gap-2">
                                            <span className="font-medium">{t.utilisation}%</span>
                                            <div className="w-16 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                                <div className="h-full bg-blue-500" style={{width: `${t.utilisation}%`}}></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td className="p-4">
                                        <span className={`px-2 py-1 rounded text-xs font-bold ${t.compliance < 90 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                                            {t.compliance}%
                                        </span>
                                    </td>
                                    <td className="p-4">
                                        <div className="flex flex-col">
                                            <span className={`font-bold ${t.deviation > 15 ? 'text-red-600' : 'text-gray-800'}`}>{t.deviation}%</span>
                                            {t.deviation > 15 && <span className="text-[10px] text-red-500">High Risk</span>}
                                        </div>
                                    </td>
                                    <td className="p-4">{t.adherence}</td>
                                    <td className="p-4 text-teal-600 font-bold cursor-pointer">View Details</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        // --- MAIN LAYOUT ---
        function AdminDashboard() {
          const [activeTab, setActiveTab] = useState('overview');

          const renderContent = () => {
            switch(activeTab) {
                case 'overview': 
                    return (
                        <div className="grid grid-cols-3 gap-6">
                            <div className="col-span-2 space-y-6">
                                <div className="grid grid-cols-2 gap-6">
                                    <KPICard title="Session Volume" value="42 / 85" sub="Daily Goal: 85" icon={Activity} trend="up" color="teal" />
                                    <KPICard title="Collections" value="₹ 28,500" sub="Exp: ₹ 51,000" icon={DollarSign} trend="down" color="blue" />
                                </div>
                                <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                    <h3 className="font-bold text-gray-800 mb-4">Clinic Pulse</h3>
                                    <div className="flex gap-4">
                                        <div className="flex-1 bg-green-50 p-4 rounded-lg text-center border border-green-100">
                                            <span className="block text-2xl font-bold text-green-700">12</span>
                                            <span className="text-xs text-green-800 uppercase font-bold">In Session</span>
                                        </div>
                                        <div className="flex-1 bg-amber-50 p-4 rounded-lg text-center border border-amber-100">
                                            <span className="block text-2xl font-bold text-amber-700">4</span>
                                            <span className="text-xs text-amber-800 uppercase font-bold">Waiting</span>
                                        </div>
                                        <div className="flex-1 bg-red-50 p-4 rounded-lg text-center border border-red-100">
                                            <span className="block text-2xl font-bold text-red-700">2</span>
                                            <span className="text-xs text-red-800 uppercase font-bold">Refill Opps</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="col-span-1">
                                <AlertPanel />
                            </div>
                        </div>
                    );
                case 'financials': return <FinancialDashboard />;
                case 'programs': return <ProgramBuilder />;
                case 'therapists': return <TherapistManagement />;
                default: return <div className="p-10 text-center text-gray-500">Module under development</div>;
            }
          };

          return (
            <div className="flex h-screen bg-slate-50 font-sans text-gray-900">
              <Sidebar active={activeTab} onNavigate={setActiveTab} />
              <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                    <h1 className="text-xl font-bold text-gray-800 capitalize">{activeTab}</h1>
                    <div className="flex items-center gap-4">
                        <span className="text-sm text-gray-500">Last Sync: 2 mins ago</span>
                        <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center">
                            <Users size={18} />
                        </div>
                    </div>
                </header>

                <main className="flex-1 overflow-y-auto p-8">
                    {renderContent()}
                </main>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
