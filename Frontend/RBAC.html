function appReducer(state,action){
  switch(action.type){
    case 'SET_ROLE':return{...state,role:action.payload};
    
    case 'CHECK_IN_PATIENT':{
      const pid=action.payload;
      return{...state,
        patients:state.patients.map(p=>p.id===pid?{...p,checkedIn:true}:p),
        sessionFlow:{...state.sessionFlow,checkedInPatients:[...state.sessionFlow.checkedInPatients,pid],inSession:[...state.sessionFlow.inSession,pid]},
      };
    }
    
    case 'CHECK_OUT_PATIENT':{
      const pid=action.payload;
      const pat=state.patients.find(p=>p.id===pid);
      const hasNext=pat?.nextSession;
      return{...state,
        patients:state.patients.map(p=>p.id===pid?{...p,checkedIn:!hasNext?false:p.checkedIn,sessionsCompleted:p.sessionsCompleted+1}:p),
        sessionFlow:{...state.sessionFlow,
          inSession:state.sessionFlow.inSession.filter(id=>id!==pid),
          waitingPickup:hasNext?state.sessionFlow.waitingPickup:[...state.sessionFlow.waitingPickup,pid],
        },
        schedule:state.schedule.map(s=>s.patient===pid&&s.status==='in_progress'?{...s,status:'completed',noteStatus:'pending'}:s),
      };
    }

    case 'APPROVE_PLAN_CHANGE':{
      const{id,comment}=action.payload;
      return{...state,planChanges:state.planChanges.map(pc=>pc.id===id?{...pc,status:'approved_st',stComment:comment}:pc)};
    }

    case 'REJECT_PLAN_CHANGE':{
      const{id,comment}=action.payload;
      return{...state,planChanges:state.planChanges.map(pc=>pc.id===id?{...pc,status:'rejected_st',stComment:comment}:pc)};
    }

    case 'ADMIN_EXECUTE_PLAN_CHANGE':{
      const id=action.payload;
      return{...state,planChanges:state.planChanges.map(pc=>pc.id===id?{...pc,adminExecuted:true}:pc)};
    }

    case 'RESOLVE_EXCEPTION':{
      const id=action.payload;
      return{...state,exceptions:state.exceptions.map(e=>e.id===id?{...e,status:'resolved'}:e)};
    }

    case 'APPROVE_PROGRAM':{
      const progId=action.payload;
      return{...state,
        programs:state.programs.map(p=>p.id===progId?{...p,status:'clinically_approved'}:p),
        pendingPublication:[...state.pendingPublication,progId],
      };
    }

    case 'PUBLISH_PROGRAM':{
      const progId=action.payload;
      const prog=state.programs.find(p=>p.id===progId);
      return{...state,
        programs:state.programs.map(p=>p.id===progId?{...p,status:'active',publishedBy:'admin'}:p),
        patients:state.patients.map(p=>p.id===prog?.patient?{...p,status:'active'}:p),
        pendingPublication:state.pendingPublication.filter(id=>id!==progId),
      };
    }

    case 'CREATE_PROGRAM_FOR_PATIENT':{
      const{patientId,evalId}=action.payload;
      const newProg={id:'PRG-NEW-'+Date.now(),patient:patientId,evalId,status:'draft',domains:['OT'],totalSessions:30,activitiesPhase1:'To be defined',activitiesPhase2:'To be defined',activitiesPhase3:'To be defined',milestones:['Milestone 1','Milestone 2'],approvedBy:null,publishedBy:null,cost:18000};
      return{...state,programs:[...state.programs,newProg],patients:state.patients.map(p=>p.id===patientId?{...p,programId:newProg.id}:p)};
    }

    case 'ADD_TOAST':{
      const id=state.toastCounter+1;
      return{...state,toasts:[...state.toasts,{id,message:action.payload.message,type:action.payload.type||'info'}],toastCounter:id};
    }

    case 'REMOVE_TOAST':return{...state,toasts:state.toasts.filter(t=>t.id!==action.payload)};

    default:return state;
  }
}

    <div className="bg-white p-5 rounded-xl border border-gray-200/80 shadow-sm">
      <div className="flex justify-between items-start mb-3">
        <div><p className="text-[11px] font-bold text-gray-400 uppercase tracking-widest">{label}</p><h3 className="text-2xl font-bold text-gray-800 mt-1">{value}</h3></div>
        <div className={`p-2.5 rounded-lg ${bg}`}><I name={icon} size={20}/></div>
      </div>
      {sub&&<p className="text-xs text-gray-500">{sub}</p>}

};

const Toast=({toast,onDismiss})=>{
  useEffect(()=>{const t=setTimeout(()=>onDismiss(toast.id),4000);return()=>clearTimeout(t);},[toast.id]);
  const bg=toast.type==='success'?'bg-green-600':toast.type==='error'?'bg-red-600':'bg-blue-600';
  return(
    <div className={`${bg} text-white px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 toast-enter`}>
      <I name={toast.type==='success'?'check':toast.type==='error'?'x':'alert'} size={16}/>
      {toast.message}
    </div>
  );
};

const ToastContainer=()=>{
  const{state,dispatch}=useContext(AppContext);
  return(
    <div className="fixed bottom-6 right-6 z-50 space-y-2">
      {state.toasts.map(t=><Toast key={t.id} toast={t} onDismiss={(id)=>dispatch({type:'REMOVE_TOAST',payload:id})}/>)}
    </div>
  );
};

);

// --- MASTER SCHEDULE ---
const MasterSchedule=()=>{
  const{state}=useContext(AppContext);
  const timeSlots=['9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM'];
  const therapists=state.therapists.filter(t=>t.status==='active');
  
  const getSlot=(time,therapistId)=>state.schedule.find(s=>s.time===time&&s.therapist===therapistId);
  const getPatient=(pid)=>state.patients.find(p=>p.id===pid);
  
  const statusColors={completed:'bg-green-100 border-green-300 text-green-800',in_progress:'bg-blue-100 border-blue-300 text-blue-800',scheduled:'bg-gray-50 border-gray-200 text-gray-700',cancelled:'bg-red-50 border-red-200 text-red-400 line-through'};

  return(
    <div className="space-y-4 anim-slide">
      <SectionHeader title="Master Schedule" subtitle="Today — Monday, 10 Feb 2026" action={<div className="flex gap-2"><button className="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-xs font-bold text-gray-600 hover:bg-gray-50 flex items-center gap-1"><I name="refresh" size={13}/>Template</button><button className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold flex items-center gap-1"><I name="plus" size={13}/>Add Slot</button></div>}/>
      
      <div className="bg-white rounded-xl border border-gray-200/80 shadow-sm overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="bg-gray-50 border-b border-gray-200">
                <th className="p-3 text-left font-bold text-gray-500 uppercase tracking-wider w-20">Time</th>
                {therapists.map(t=><th key={t.id} className="p-3 text-center font-bold text-gray-500 uppercase tracking-wider min-w-[160px]">{t.name}<span className="block font-normal text-gray-400 text-[10px]">{t.role}</span></th>)}
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {timeSlots.map(time=>(
                <tr key={time} className="hover:bg-gray-50/50">
                  <td className="p-3 font-mono font-bold text-gray-600">{time}</td>
                  {therapists.map(t=>{
                    const slot=getSlot(time,t.id);
                    if(!slot)return<td key={t.id} className="p-2"><div className="h-14 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center text-gray-300 cursor-pointer hover:border-blue-300 hover:bg-blue-50/30 transition-all"><I name="plus" size={14}/></div></td>;
                    const pat=getPatient(slot.patient);
                    return(
                      <td key={t.id} className="p-2">
                        <div className={`p-2.5 rounded-lg border ${statusColors[slot.status]} cursor-pointer hover:shadow-md transition-all`}>
                          <div className="font-bold">{pat?.name||'—'}</div>
                          <div className="text-[10px] mt-0.5 opacity-75">{slot.type} • Session</div>
                          <div className="flex justify-between items-center mt-1">
                            <Badge color={slot.status==='completed'?'green':slot.status==='in_progress'?'blue':slot.status==='cancelled'?'red':'gray'}>{slot.status==='in_progress'?'LIVE':slot.status}</Badge>
                            {slot.status==='cancelled'&&slot.cancelledRefilled&&<Badge color="teal">Refilled</Badge>}
                          </div>
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-4">
        <div className="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm"><h4 className="text-[11px] font-bold text-gray-400 uppercase mb-2">Slot Utilisation</h4><div className="text-2xl font-bold text-gray-800">78%</div><div className="w-full bg-gray-100 h-2 rounded-full mt-2"><div className="bg-blue-500 h-full rounded-full" style={{width:'78%'}}/></div></div>
        <div className="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm"><h4 className="text-[11px] font-bold text-gray-400 uppercase mb-2">Refill Opportunities</h4><div className="text-2xl font-bold text-amber-600">2</div><p className="text-xs text-gray-500 mt-1">Cancelled slots available for refill</p></div>
        <div className="bg-white p-4 rounded-xl border border-gray-200/80 shadow-sm"><h4 className="text-[11px] font-bold text-gray-400 uppercase mb-2">Leave Impact</h4><div className="text-2xl font-bold text-gray-800">0</div><p className="text-xs text-gray-500 mt-1">No therapist leaves today</p></div>
      </div>
    </div>
  );
};

          <Badge color="blue">{activePatients.length} Active Patients</Badge>
        </div>
        <div className="divide-y divide-gray-100">

                  className="px-5 py-2 bg-green-600 text-white text-sm font-bold rounded-lg hover:bg-green-700 flex items-center gap-1.5"><I name="check" size={14}/>Approve Program</button>
              </div>
            </div>
          );
        })}
      </div>}

      {approved.length>0&&<div>
        <h3 className="text-sm font-bold text-green-700 mb-3 flex items-center gap-2"><I name="check" size={15}/>Clinically Approved — Awaiting Admin Publication</h3>
        {approved.map(prog=>{const pat=getPatient(prog.patient);return(
          <div key={prog.id} className="bg-green-50 border border-green-200 rounded-xl p-4 mb-2 flex justify-between items-center">
            <div><span className="font-bold text-gray-800 text-sm">{pat?.name}</span><span className="text-xs text-gray-500 ml-2">{prog.domains.join('+')} | {prog.totalSessions} sessions</span></div>
            <Badge color="green">Approved — Pending Publication</Badge>
          </div>
        );})}
      </div>}

      <div>
        <h3 className="text-sm font-bold text-gray-600 mb-3">Active Programs</h3>
        <div className="space-y-2">
          {active.map(prog=>{
            const pat=getPatient(prog.patient);
            const progress=pat?Math.round(pat.sessionsCompleted/prog.totalSessions*100):0;
            return(
              <div key={prog.id} className="bg-white rounded-xl border border-gray-200/80 shadow-sm p-4 flex items-center gap-4">
                <div className="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center font-bold text-green-700 text-sm shrink-0">{progress}%</div>
                <div className="flex-1">
                  <div className="flex items-center gap-2"><span className="font-bold text-gray-800 text-sm">{pat?.name}</span><Badge color="teal">{prog.domains.join(' + ')}</Badge></div>
                  <div className="w-full bg-gray-100 h-1.5 rounded-full mt-1.5"><div className="bg-green-500 h-full rounded-full transition-all" style={{width:`${progress}%`}}/></div>
                  <p className="text-[10px] text-gray-500 mt-1">{pat?.sessionsCompleted}/{prog.totalSessions} sessions | Milestones: {prog.milestones.length} defined</p>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <BlockedPanel title="Financial Data (Billing, Pricing, Revenue)" role="Admin"/>
    </div>
  );
};

// --- PLAN CHANGE QUEUE (ST) ---
const PlanChangeQueue=()=>{
  const{state,dispatch}=useContext(AppContext);
  const[comment,setComment]=useState('');
  const toast=(msg,type)=>dispatch({type:'ADD_TOAST',payload:{message:msg,type}});
  const getPatient=(pid)=>state.patients.find(p=>p.id===pid);

  const pending=state.planChanges.filter(pc=>pc.status==='pending_st');
  const reviewed=state.planChanges.filter(pc=>pc.status!=='pending_st');

  return(
    <div className="space-y-6 anim-slide">
      <SectionHeader title="Plan Change Approvals" subtitle="Review and approve/reject therapist-submitted plan change recommendations"/>

      {pending.length>0?pending.map(pc=>{
        const pat=getPatient(pc.patient);
        const requestor=state.therapists.find(t=>t.id===pc.requestor);
        return(
          <div key={pc.id} className="bg-white rounded-xl border border-amber-200 shadow-sm p-5">
            <div className="flex justify-between items-start mb-3">
              <div><h4 className="font-bold text-gray-800">{pat?.name} — {pc.type}</h4><p className="text-xs text-gray-500">Requested by: {requestor?.name} | {pc.date}</p></div>
              <Badge color="amber">Pending Your Review</Badge>
            </div>
            <div className="bg-gray-50 rounded-lg p-3 text-xs text-gray-700 mb-3">{pc.detail}</div>
            <div className="grid grid-cols-2 gap-3 text-xs mb-4">
              <div className="bg-red-50 p-3 rounded border border-red-200"><span className="text-red-600 font-bold">Current Plan:</span><span className="block text-gray-700 mt-0.5">{pc.currentPlan}</span></div>
              <div className="bg-green-50 p-3 rounded border border-green-200"><span className="text-green-600 font-bold">Proposed Change:</span><span className="block text-gray-700 mt-0.5">{pc.proposedPlan}</span></div>
            </div>
            <div className="mb-3">
              <label className="text-[11px] font-bold text-gray-500 uppercase block mb-1">Clinical Rationale / Comment</label>
              <textarea value={comment} onChange={e=>setComment(e.target.value)} className="w-full p-2.5 border border-gray-200 rounded-lg text-xs resize-none h-16 focus:outline-none focus:ring-2 focus:ring-green-500/30" placeholder="Add your clinical rationale for approval or rejection..."/>
            </div>
            <div className="flex justify-end gap-2">
              <button onClick={()=>{dispatch({type:'REJECT_PLAN_CHANGE',payload:{id:pc.id,comment:comment||'Insufficient clinical justification'}});setComment('');toast(`Plan change for ${pat?.name} rejected — therapist notified`,'error');}}
                className="px-4 py-2 bg-red-100 text-red-700 text-xs font-bold rounded-lg hover:bg-red-200 flex items-center gap-1.5"><I name="x" size={14}/>Reject</button>
              <button onClick={()=>{dispatch({type:'APPROVE_PLAN_CHANGE',payload:{id:pc.id,comment:comment||'Clinically justified — proceed'}});setComment('');toast(`Plan change for ${pat?.name} approved — sent to Admin for execution`,'success');}}
                className="px-5 py-2 bg-green-600 text-white text-xs font-bold rounded-lg hover:bg-green-700 flex items-center gap-1.5"><I name="check" size={14}/>Approve</button>
            </div>
          </div>
        );
      }):<div className="bg-green-50 border border-green-200 rounded-xl p-6 text-center"><I name="check" size={32} className="text-green-400 mx-auto mb-2"/><p className="font-bold text-green-700 text-sm">No pending plan change requests</p></div>}

      {reviewed.length>0&&<div>
        <h3 className="text-xs font-bold text-gray-400 uppercase mb-2">Previously Reviewed</h3>
        {reviewed.map(pc=>{const pat=getPatient(pc.patient);return(
          <div key={pc.id} className="bg-gray-50 rounded-lg p-3 flex items-center justify-between mb-2 text-xs">
            <div><span className="font-bold text-gray-700">{pat?.name} — {pc.type}</span>{pc.stComment&&<span className="text-gray-500 ml-2">"{pc.stComment}"</span>}</div>
            <div className="flex gap-2">
              <Badge color={pc.status==='approved_st'?'green':'red'}>{pc.status==='approved_st'?'Approved':'Rejected'}</Badge>
              {pc.status==='approved_st'&&<Badge color={pc.adminExecuted?'blue':'amber'}>{pc.adminExecuted?'Executed':'Awaiting Admin'}</Badge>}
            </div>
          </div>
        );})}
      </div>}
    </div>
  );
};

// --- CLINICAL QUALITY ---
const ClinicalQuality=()=>{
  const{state}=useContext(AppContext);
  return(
    <div className="space-y-6 anim-slide">
      <SectionHeader title="Clinical Quality Oversight" subtitle="Patient outcomes, program adherence, therapist clinical benchmarks"/>
      
      <div className="grid grid-cols-3 gap-4">
        <KPI label="On Track" value={state.patients.filter(p=>p.status==='active'&&p.sessionsCompleted/p.sessionsTotal>0.3).length} sub="Patients meeting milestones" icon="check" color="green"/>
        <KPI label="Needs Attention" value={1} sub="Stalled or behind schedule" icon="alert" color="red"/>
        <KPI label="Avg Adherence" value="89%" sub="Across all therapists" icon="bar" color="blue"/>
      </div>

      <div className="bg-white rounded-xl border border-gray-200/80 shadow-sm p-5">
        <h3 className="font-bold text-gray-800 text-sm mb-4">Therapist Clinical Performance</h3>
        <table className="w-full text-xs">
          <thead className="bg-gray-50 border-b"><tr><th className="p-3 text-left font-bold text-gray-500 uppercase">Therapist</th><th className="p-3 text-left font-bold text-gray-500 uppercase">Program Deviation</th><th className="p-3 text-left font-bold text-gray-500 uppercase">Milestone Rate</th><th className="p-3 text-left font-bold text-gray-500 uppercase">Patient Outcomes</th><th className="p-3 text-left font-bold text-gray-500 uppercase">Assessment</th></tr></thead>
          <tbody className="divide-y">
            {state.therapists.map(t=>(
              <tr key={t.id} className="hover:bg-gray-50">
                <td className="p-3 font-bold text-gray-800">{t.name} ({t.role})</td>
                <td className="p-3"><span className={`font-bold ${t.deviation>30?'text-red-600':t.deviation>15?'text-amber-600':'text-green-600'}`}>{t.deviation}%</span>{t.deviation>30&&<span className="text-[10px] text-red-500 block">EXCEEDS THRESHOLD</span>}</td>
                <td className="p-3">{t.deviation<10?'92%':t.deviation<20?'78%':'61%'}</td>
                <td className="p-3">{t.deviation<10?'Excellent':t.deviation<20?'Good':'Below Standard'}</td>
                <td className="p-3"><Badge color={t.deviation>30?'red':t.deviation>15?'amber':'green'}>{t.deviation>30?'Review Needed':t.deviation>15?'Monitor':'On Track'}</Badge></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div className="bg-white rounded-xl border border-gray-200/80 shadow-sm p-5">
        <h3 className="font-bold text-gray-800 text-sm mb-4">Patient Progress Overview</h3>
        <div className="space-y-3">
          {state.patients.filter(p=>p.status==='active').map(p=>{
            const prog=state.programs.find(pr=>pr.patient===p.id);
            const pct=prog?Math.round(p.sessionsCompleted/prog.totalSessions*100):0;
            const isStalled=pct>10&&pct<40;
            return(
              <div key={p.id} className="flex items-center gap-4">
                <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-500">{p.name.split(' ').map(n=>n[0]).join('')}</div>
                <div className="flex-1"><div className="flex items-center gap-2 text-xs"><span className="font-bold text-gray-800">{p.name}</span><span className="text-gray-400">{p.domains.join('+')}</span>{isStalled&&<Badge color="red">Stalled</Badge>}</div><div className="w-full bg-gray-100 h-1.5 rounded-full mt-1"><div className={`h-full rounded-full ${isStalled?'bg-red-400':'bg-green-500'}`} style={{width:`${pct}%`}}/></div></div>
                <span className="text-xs font-bold text-gray-600 w-10 text-right">{pct}%</span>
              </div>
            );
          })}
        </div>
      </div>

      <BlockedPanel title="Operational Compliance Metrics (Note Submission Rates, Check-in Accuracy)" role="Admin"/>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════
function App(){
  const[state,dispatch]=React.useReducer(appReducer,INITIAL_STATE);
  const[activeTab,setActiveTab]=useState('overview');

  // Reset tab when role changes
  useEffect(()=>{
    if(state.role==='admin'&&activeTab.startsWith('st_'))setActiveTab('overview');
    if(state.role==='seniorTherapist'&&!activeTab.startsWith('st_'))setActiveTab('st_overview');
  },[state.role]);

  const renderContent=()=>{
    switch(activeTab){
      // Admin modules
      case 'overview':return<AdminOverview/>;
      case 'schedule':return<MasterSchedule/>;
      case 'session':return<SessionLifecycle/>;
      case 'publication':return<ProgramPublication/>;
      case 'therapists':return<TherapistHR/>;
      case 'financials':return<Financials/>;
      case 'exceptions':return<Exceptions/>;
      case 'settings':return<SystemSettings/>;
      // Senior Therapist modules
      case 'st_overview':return<STOverview/>;
      case 'st_evaluations':return<Evaluations/>;
      case 'st_programs':return<STProgramDesign/>;
      case 'st_planchanges':return<PlanChangeQueue/>;
      case 'st_quality':return<ClinicalQuality/>;
      case 'st_protocols':return<ProtocolLibrary/>;
      case 'st_video':return<VideoProgress/>;
      default:return<div className="p-10 text-center text-gray-500">Module under development</div>;
    }
  };

  const isAdmin=state.role==='admin';
  const borderClass=isAdmin?'role-glow-blue':'role-glow-green';

  return(
    <AppContext.Provider value={{state,dispatch}}>
      <div className="flex flex-col h-screen overflow-hidden">
        <RoleSwitcher/>
        <div className="flex flex-1 min-h-0">
          <Sidebar active={activeTab} onNavigate={setActiveTab}/>
          <div className="flex-1 flex flex-col min-w-0">
            <header className={`h-12 bg-white border-b flex items-center justify-between px-6 shrink-0 ${isAdmin?'border-blue-200':'border-green-200'}`}>
              <div className="flex items-center gap-3">
                <div className={`w-2 h-2 rounded-full ${isAdmin?'bg-blue-500':'bg-green-500'}`}/>
                <h1 className="text-sm font-bold text-gray-800 capitalize">{activeTab.replace('st_','').replace(/_/g,' ')}</h1>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-[10px] text-gray-400">Mon 10 Feb 2026 • 10:32 AM</span>
                <div className={`px-2 py-1 rounded text-[10px] font-bold ${isAdmin?'bg-blue-100 text-blue-700':'bg-green-100 text-green-700'}`}>{isAdmin?'ADMIN':'SENIOR THERAPIST'}</div>
              </div>
            </header>
            <main className="flex-1 overflow-y-auto p-6 bg-gray-50/50">
              {renderContent()}
            </main>
          </div>
        </div>
      </div>
      <ToastContainer/>
    </AppContext.Provider>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
